name: Release

# Triggers on any tag that looks like a version: v1.0.0, v1.2.3-beta.1, etc.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create a GitHub Release and upload assets

jobs:
  # ── Windows installer (x64 + arm64 + ia32 NSIS + portable) ─────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build + package (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment + add secrets to sign:
          # CSC_LINK:          ${{ secrets.WIN_CSC_LINK }}
          # CSC_KEY_PASSWORD:  ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-vite build && npx electron-builder --win --publish always

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 7

  # ── macOS (dmg + zip, universal) ────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build + package (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment + add secrets for notarization:
          # CSC_LINK:                   ${{ secrets.MAC_CSC_LINK }}
          # CSC_KEY_PASSWORD:           ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # APPLE_ID:                   ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD:${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-vite build && npx electron-builder --mac --publish always

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          retention-days: 7

  # ── Linux (AppImage + deb) ──────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build + package (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-vite build && npx electron-builder --linux --publish always

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
          retention-days: 7