name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Windows ──────────────────────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: framora
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: framora/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create empty dlgo-bin stub (AI binaries shipped separately)
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path ..\dlgo-bin | Out-Null

      - name: Build + package (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-vite build && npx electron-builder --win --publish always

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            framora/dist/*.exe
            framora/dist/latest.yml
          retention-days: 7

  # ── macOS ────────────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: framora
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: framora/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create empty dlgo-bin stub
        run: mkdir -p ../dlgo-bin

      - name: Build + package (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-vite build && npx electron-builder --mac --publish always

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: |
            framora/dist/*.dmg
            framora/dist/*.zip
            framora/dist/latest-mac.yml
          retention-days: 7

  # ── Linux ────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framora
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: framora/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create empty dlgo-bin stub
        run: mkdir -p ../dlgo-bin

      - name: Build + package (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-vite build && npx electron-builder --linux --publish always

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            framora/dist/*.AppImage
            framora/dist/*.deb
            framora/dist/latest-linux.yml
          retention-days: 7